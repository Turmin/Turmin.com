<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Turmin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1E1A44">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <div class="error">
      <a class="lockup lockup-sm" href="/" aria-label="Turmin home">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" d="M47.5 11.2A26 26 0 1 1 32 6"/>
          <circle cx="44" cy="8.6" r="4.2" fill="#3DDC97"/>
          <path fill="currentColor" d="M18 20H46V28H36V46H28V28H18Z"/>
        </svg>
        <span class="wordmark">Turmin</span>
      </a>
      <h1 class="error-code">503</h1>
      <p class="error-title">Service unavailable</p>
      <p class="error-text">The site is temporarily unavailable. Try again in a moment.</p>
      <a class="error-link" href="/">Go to turmin.com</a>
    </div>
    <p class="est">EST. 2006 - The Netherlands</p>
  </main>
</body>
</html>
